name: Build StrataForge Android
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Inject optional diagnostics token into APK assets
        env:
          DIAGNOSTICS_TOKEN: ${{ secrets.STRATAFORGE_DIAGNOSTICS_TOKEN }}
        run: |
          mkdir -p app/src/main/assets
          if [ -n "$DIAGNOSTICS_TOKEN" ]; then
            case "$DIAGNOSTICS_TOKEN" in
              github_pat_*) printf '%s' "$DIAGNOSTICS_TOKEN" > app/src/main/assets/strataforge-diagnostics-token.txt ;;
              *) echo 'Configured token is not a fine-grained GitHub token' >&2; exit 1 ;;
            esac
          else
            echo 'Diagnostics token secret is absent; APK will require one-time manual token configuration'
          fi
      - name: Compile
        run: gradle --no-daemon assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk && unzip -t app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StrataForge-Android-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
