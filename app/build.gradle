plugins { id 'com.android.application' }
android {
 namespace 'dev.strataforge.android'
 compileSdk 35
 defaultConfig { applicationId 'dev.strataforge.android'; minSdk 26; targetSdk 35; versionCode 9; versionName '0.4.3' }
 signingConfigs {
  debug {
   storeFile file("$rootDir/debugsign/debug.p12")
   storePassword 'android'
   keyAlias 'strataforge_debug'
   keyPassword 'android'
   storeType 'pkcs12'
  }
 }
 packaging { resources { excludes += ["META-INF/versions/9/OSGI-INF/MANIFEST.MF"] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation 'androidx.core:core:1.13.1'
 implementation 'in.dragonbra:javasteam:1.8.0'
 implementation 'in.dragonbra:javasteam-depotdownloader:1.8.0'
 implementation 'com.google.zxing:core:3.5.3'
 implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
}
